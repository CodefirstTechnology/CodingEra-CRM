<header class="navbar">
  <div class="navbar__search-wrap">
    <label class="navbar__search" aria-label="Search">
      <span class="navbar__search-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
      </span>
      <input
        type="search"
        class="navbar__search-input"
        placeholder="Search contacts, deals, or reports..."
        autocomplete="off"
      />
    </label>
  </div>

  <div class="navbar__right">
    <button type="button" class="navbar__icon-btn navbar__notify" aria-label="Notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
      <span class="navbar__dot" aria-hidden="true"></span>
    </button>
    <button type="button" class="navbar__icon-btn" (click)="openSettings()" aria-label="Settings and theme">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
        />
      </svg>
    </button>
    <div class="navbar__target" title="Progress toward quarterly goal">
      <span class="navbar__target-label">Quarterly target</span>
      <div class="navbar__target-row">
        <span class="navbar__target-value">$2.4M</span>
        <span class="navbar__target-sep">/</span>
        <span class="navbar__target-cap">$3.0M</span>
      </div>
      <div class="navbar__target-bar" role="presentation">
        <span class="navbar__target-fill" style="width: 80%"></span>
      </div>
    </div>
    <button
      type="button"
      class="navbar__avatar-btn"
      (click)="openProfile()"
      aria-haspopup="dialog"
      [attr.aria-expanded]="profilePanel.open()"
      aria-label="Open profile"
    >
      <span class="navbar__avatar">AR</span>
    </button>
  </div>
</header>
