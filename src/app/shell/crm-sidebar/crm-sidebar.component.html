<aside class="sidebar">
  <div class="sidebar__top">
    <div class="sidebar__brand">
      <span class="sidebar__logo-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path d="M3 21h18M5 21V7l7-3 7 3v14" />
          <path d="M9 10v4M12 10v4M15 10v4" />
        </svg>
      </span>
      <div class="sidebar__titles">
        <span class="sidebar__name">Sales Ledger</span>
        <span class="sidebar__tag">Enterprise CRM</span>
      </div>
    </div>
    <a routerLink="/leads" class="sidebar__cta" (click)="$event.stopPropagation()">
      <span aria-hidden="true">+</span>
      Create New
    </a>
  </div>

  <nav class="sidebar__nav" aria-label="Main">
    <a
      routerLink="/"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
    >
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="9" rx="1" />
          <rect x="14" y="3" width="7" height="5" rx="1" />
          <rect x="14" y="12" width="7" height="9" rx="1" />
          <rect x="3" y="16" width="7" height="5" rx="1" />
        </svg>
      </span>
      <span class="nav-item__label">Dashboard</span>
    </a>
    <a routerLink="/leads" routerLinkActive="is-active" class="nav-item">
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
      </span>
      <span class="nav-item__label">Leads</span>
    </a>
    <a routerLink="/organizations" routerLinkActive="is-active" class="nav-item">
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="7" width="20" height="14" rx="2" />
          <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
        </svg>
      </span>
      <span class="nav-item__label">Accounts</span>
    </a>
    <a routerLink="/contacts" routerLinkActive="is-active" class="nav-item">
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </span>
      <span class="nav-item__label">Contacts</span>
    </a>
    <a routerLink="/deals" routerLinkActive="is-active" class="nav-item">
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
        </svg>
      </span>
      <span class="nav-item__label">Deals</span>
    </a>
    <a routerLink="/tasks" routerLinkActive="is-active" class="nav-item">
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
      </span>
      <span class="nav-item__label">Activities</span>
    </a>
    <a routerLink="/reports" routerLinkActive="is-active" class="nav-item">
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3v18h18" />
          <path d="M7 16l4-4 3 3 5-6" />
        </svg>
      </span>
      <span class="nav-item__label">Reports</span>
    </a>
  </nav>

  <div class="sidebar__footer">
    <button type="button" class="sidebar__user" (click)="openProfile()" aria-haspopup="dialog">
      <span class="sidebar__avatar" aria-hidden="true">AR</span>
      <div class="sidebar__user-text">
        <span class="sidebar__user-name">Alex Rivera</span>
        <span class="sidebar__user-role">Sales Director</span>
      </div>
    </button>
    <button
      type="button"
      class="sidebar__icon-btn"
      (click)="openSettings()"
      aria-label="Open settings"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
        />
      </svg>
    </button>
  </div>
</aside>
