<header class="navbar">
  <div class="navbar__left">
    <span class="navbar__workspace" title="Workspace">Sales</span>
    <span class="navbar__breadcrumb">CRM</span>
    <span class="navbar__slash">/</span>
    <span class="navbar__page">Workspace</span>
  </div>
  <div class="navbar__right">
    <button type="button" class="navbar__icon-btn" aria-label="Search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
    </button>
    <button
      type="button"
      class="navbar__icon-btn navbar__notify"
      (click)="openNotifications()"
      aria-label="Notifications"
      aria-haspopup="dialog"
      [attr.aria-expanded]="notificationsPanel.open()"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
      @if (notificationsPanel.unreadCount() > 0) {
        <span class="navbar__badge">{{ notificationBadgeText() }}</span>
      }
    </button>
    <button type="button" class="btn btn--primary" (click)="openTheme()">Theme</button>
    <button
      type="button"
      class="navbar__avatar-btn"
      (click)="openProfile()"
      aria-haspopup="dialog"
      [attr.aria-expanded]="profilePanel.open()"
      aria-label="Open profile"
    >
      <span class="navbar__avatar">JD</span>
    </button>
  </div>
</header>
