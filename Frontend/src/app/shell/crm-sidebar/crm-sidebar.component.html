<aside class="sidebar">
  <div class="sidebar__brand">
    <span class="sidebar__logo">CRM</span>
    <span class="sidebar__tag">Pro</span>
  </div>
  <div class="sidebar__create-wrap">
    <button type="button" class="sidebar__create" (click)="openCreateMenu()" aria-haspopup="dialog" aria-label="Create new record">
      <span class="sidebar__create-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </span>
      <span class="sidebar__create-label">+ Create New</span>
    </button>
  </div>
  <nav class="sidebar__nav" aria-label="Main">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="9" rx="1" />
          <rect x="14" y="3" width="7" height="5" rx="1" />
          <rect x="14" y="12" width="7" height="9" rx="1" />
          <rect x="3" y="16" width="7" height="5" rx="1" />
        </svg>
      </span>
      <span class="nav-item__label">Dashboard</span>
    </a>
    <a routerLink="/leads" routerLinkActive="is-active" class="nav-item">
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
      </span>
      <span class="nav-item__label">Leads</span>
    </a>
    <a routerLink="/deals" routerLinkActive="is-active" class="nav-item">
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="none" stroke-linejoin="round" />
        </svg>
      </span>
      <span class="nav-item__label">Deals</span>
    </a>
    <a routerLink="/contacts" routerLinkActive="is-active" class="nav-item">
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="4" y="4" width="16" height="16" rx="2" />
          <circle cx="12" cy="10" r="2" />
          <path d="M8 18c0-2.2 1.8-4 4-4s4 1.8 4 4" />
        </svg>
      </span>
      <span class="nav-item__label">Contacts</span>
    </a>
    <a routerLink="/organizations" routerLinkActive="is-active" class="nav-item">
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4" />
          <path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01" />
        </svg>
      </span>
      <span class="nav-item__label">Organizations</span>
    </a>
    <a routerLink="/notes" routerLinkActive="is-active" class="nav-item">
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
          <polyline points="10 9 9 9 8 9" />
        </svg>
      </span>
      <span class="nav-item__label">Notes</span>
    </a>
    <a routerLink="/tasks" routerLinkActive="is-active" class="nav-item">
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
          <polyline points="22 4 12 14.01 9 11.01" />
        </svg>
      </span>
      <span class="nav-item__label">Tasks</span>
    </a>
    <a routerLink="/call-logs" routerLinkActive="is-active" class="nav-item">
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
          />
        </svg>
      </span>
      <span class="nav-item__label">Call logs</span>
    </a>
  </nav>

  <div class="sidebar__footer-nav">
    <a routerLink="/help" routerLinkActive="is-active" class="nav-item">
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      </span>
      <span class="nav-item__label">Help</span>
    </a>
    <button
      type="button"
      class="nav-item nav-item--toggle"
      (click)="toggleCollapse()"
      [attr.aria-pressed]="sidebarCollapse.collapsed()"
      [attr.aria-label]="sidebarCollapse.collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <span class="nav-item__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M9 3v18" />
          <path d="M16 15l-4-3 4-3" />
        </svg>
      </span>
      <span class="nav-item__label">{{ sidebarCollapse.collapsed() ? 'Expand' : 'Collapse' }}</span>
    </button>
  </div>
</aside>
