<app-crm-modal
  [open]="flow.pickerOpen()"
  [title]="'Create New'"
  [size]="'sm'"
  (dismiss)="onDismiss()"
>
  <p class="create-picker__hint">Choose a record type to get started.</p>
  <div class="create-picker__list" role="listbox" aria-label="Record types">
    @for (opt of options; track opt.kind; let i = $index) {
      <button
        type="button"
        class="create-picker__card"
        [class.create-picker__card--active]="isActive(i)"
        (click)="select(opt.kind)"
        (mouseenter)="focusedIndex.set(i)"
        role="option"
        [attr.aria-selected]="isActive(i)"
      >
        <span class="create-picker__icon" aria-hidden="true">
          @switch (opt.kind) {
            @case ('lead') {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              </svg>
            }
            @case ('deal') {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke-linejoin="round" />
              </svg>
            }
            @case ('contact') {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="4" y="4" width="16" height="16" rx="2" />
                <circle cx="12" cy="10" r="2" />
                <path d="M8 18c0-2.2 1.8-4 4-4s4 1.8 4 4" />
              </svg>
            }
            @case ('organization') {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4" />
              </svg>
            }
            @case ('task') {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                <polyline points="22 4 12 14.01 9 11.01" />
              </svg>
            }
          }
        </span>
        <span class="create-picker__label">{{ opt.label }}</span>
        <span class="create-picker__chevron" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </span>
      </button>
    }
  </div>
  <p class="create-picker__kbd-hint">
    <kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> select · <kbd>Esc</kbd> close
  </p>
</app-crm-modal>
