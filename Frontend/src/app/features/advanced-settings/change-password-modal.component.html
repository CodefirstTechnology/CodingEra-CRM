<app-crm-modal
  [open]="open()"
  title="Change password"
  size="sm"
  [showFooter]="true"
  (dismiss)="onDismiss()"
>
  <p class="change-password-modal__hint">
    Enter your current password, then choose a new one.
  </p>
  <form class="change-password-modal__form" [formGroup]="form" (ngSubmit)="onConfirm()">
    <label class="change-password-modal__field">
      <span>Current password <span class="change-password-modal__req">*</span></span>
      <div class="change-password-modal__password-wrap">
        <input
          [type]="showCurrent() ? 'text' : 'password'"
          formControlName="currentPassword"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="change-password-modal__password-toggle"
          [attr.aria-label]="showCurrent() ? 'Hide current password' : 'Show current password'"
          [attr.aria-pressed]="showCurrent()"
          [disabled]="submitting()"
          (click)="toggleVisibility('current')"
        >
          @if (showCurrent()) {
          <svg class="change-password-modal__password-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          } @else {
          <svg class="change-password-modal__password-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          }
        </button>
      </div>
      @if (fieldInvalid('currentPassword')) {
        <small class="change-password-modal__field-error"
          >Current password is required (at least 6 characters).</small
        >
      }
    </label>

    <label class="change-password-modal__field">
      <span>New password <span class="change-password-modal__req">*</span></span>
      <div class="change-password-modal__password-wrap">
        <input
          [type]="showNew() ? 'text' : 'password'"
          formControlName="newPassword"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="change-password-modal__password-toggle"
          [attr.aria-label]="showNew() ? 'Hide new password' : 'Show new password'"
          [attr.aria-pressed]="showNew()"
          [disabled]="submitting()"
          (click)="toggleVisibility('new')"
        >
          @if (showNew()) {
          <svg class="change-password-modal__password-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          } @else {
          <svg class="change-password-modal__password-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          }
        </button>
      </div>
      @if (fieldInvalid('newPassword')) {
        <small class="change-password-modal__field-error"
          >New password is required (at least 6 characters).</small
        >
      }
    </label>

    <label class="change-password-modal__field">
      <span>Confirm new password <span class="change-password-modal__req">*</span></span>
      <div class="change-password-modal__password-wrap">
        <input
          [type]="showConfirm() ? 'text' : 'password'"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="change-password-modal__password-toggle"
          [attr.aria-label]="showConfirm() ? 'Hide confirm password' : 'Show confirm password'"
          [attr.aria-pressed]="showConfirm()"
          [disabled]="submitting()"
          (click)="toggleVisibility('confirm')"
        >
          @if (showConfirm()) {
          <svg class="change-password-modal__password-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          } @else {
          <svg class="change-password-modal__password-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          }
        </button>
      </div>
      @if (fieldInvalid('confirmPassword')) {
        <small class="change-password-modal__field-error">Confirm the new password.</small>
      }
      @if (confirmMismatch()) {
        <small class="change-password-modal__field-error">Passwords do not match.</small>
      }
    </label>

    @if (formError(); as errMsg) {
      <p class="change-password-modal__banner" role="alert">{{ errMsg }}</p>
    }

    <div crmModalFooter class="change-password-modal__foot">
      <button
        type="button"
        class="change-password-modal__btn change-password-modal__btn--ghost"
        [disabled]="submitting()"
        (click)="onDismiss()"
      >
        Cancel
      </button>
      <button
        type="submit"
        class="change-password-modal__btn change-password-modal__btn--primary"
        [disabled]="submitting()"
      >
        {{ submitting() ? 'Updating…' : 'Update password' }}
      </button>
    </div>
  </form>
</app-crm-modal>
