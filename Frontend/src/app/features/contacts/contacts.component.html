<div class="contacts">
  <header class="contacts__head">
    <div>
      <h1 class="contacts__title">Contacts</h1>
      <p class="contacts__sub">People and companies you work with.</p>
    </div>
    <button type="button" class="contacts__btn contacts__btn--solid" (click)="openForm()">+ New contact</button>
  </header>

  <app-crm-selection-bar
    [selectionCount]="sel.selectedCount()"
    [canEdit]="sel.selectedCount() === 1"
    [showAssignActions]="false"
    [showConvertLead]="false"
    (edit)="onBulkEdit()"
    (delete)="onBulkDelete()"
    (dismiss)="onBulkDismiss()"
  />

  @if (formOpen()) {
    <div class="contacts__modal-root" aria-modal="true" role="dialog" aria-labelledby="new-contact-title">
      <div class="contacts__modal-backdrop" (click)="closeForm()"></div>
      <div class="contacts__modal" (click)="$event.stopPropagation()">
        <header class="contacts__modal-head">
          <h2 id="new-contact-title" class="contacts__modal-title">
            {{ editingNumericId() != null ? 'Edit contact' : 'New contact' }}
          </h2>
          <div class="contacts__modal-tools">
            <button type="button" class="contacts__modal-icon" aria-label="Expand (demo)" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
              </svg>
            </button>
            <button type="button" class="contacts__modal-icon" (click)="closeForm()" aria-label="Close">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6 6 18M6 6l12 12" />
              </svg>
            </button>
          </div>
        </header>

        <form class="contacts__modal-form" [formGroup]="createForm" (ngSubmit)="submitContact()">
          <label class="contacts__field">
            <span class="contacts__label">Salutation</span>
            <select class="contacts__control contacts__control--soft" formControlName="salutation">
              @for (s of salutationOptions; track s) {
                <option [value]="s">{{ s === '' ? 'Salutation' : s }}</option>
              }
            </select>
          </label>

          <div class="contacts__row2">
            <label class="contacts__field">
              <span class="contacts__label">First Name</span>
              <input
                class="contacts__control contacts__control--soft"
                type="text"
                formControlName="firstName"
                placeholder="First Name"
              />
              @if (fieldInvalid('firstName')) {
                <span class="contacts__err">First name is required.</span>
              }
            </label>
            <label class="contacts__field">
              <span class="contacts__label">Last Name</span>
              <input
                class="contacts__control contacts__control--soft"
                type="text"
                formControlName="lastName"
                placeholder="Last Name"
              />
              @if (fieldInvalid('lastName')) {
                <span class="contacts__err">Last name is required.</span>
              }
            </label>
          </div>

          <label class="contacts__field">
            <span class="contacts__label">Email Address</span>
            <input
              class="contacts__control contacts__control--soft"
              type="email"
              formControlName="email"
              placeholder="Email Address"
              (input)="clearEmailDuplicate()"
            />
            @if (createForm.get('email')?.errors?.['duplicate']) {
              <span class="contacts__err">A contact with this email already exists.</span>
            } @else if (fieldInvalid('email') && createForm.get('email')?.errors?.['required']) {
              <span class="contacts__err">Email is required.</span>
            } @else if (fieldInvalid('email') && createForm.get('email')?.errors?.['email']) {
              <span class="contacts__err">Enter a valid email address.</span>
            }
          </label>

          <div class="contacts__row2">
            <label class="contacts__field">
              <span class="contacts__label">Mobile No</span>
              <input class="contacts__control contacts__control--soft" type="tel" formControlName="mobile" placeholder="Mobile No" />
              @if (fieldInvalid('mobile') && createForm.get('mobile')?.errors?.['phone']) {
                <span class="contacts__err">Enter a valid phone number.</span>
              }
            </label>
            <label class="contacts__field">
              <span class="contacts__label">Gender</span>
              <select class="contacts__control contacts__control--soft" formControlName="gender">
                @for (g of genderOptions; track g) {
                  <option [value]="g">{{ g === '' ? 'Gender' : g }}</option>
                }
              </select>
            </label>
          </div>

          <label class="contacts__field">
            <span class="contacts__label">Company Name</span>
            <input
              class="contacts__control contacts__control--soft"
              type="text"
              formControlName="companyName"
              placeholder="Company Name"
            />
            @if (fieldInvalid('companyName')) {
              <span class="contacts__err">Company name is required.</span>
            }
          </label>

          <label class="contacts__field">
            <span class="contacts__label">Designation</span>
            <input
              class="contacts__control contacts__control--soft"
              type="text"
              formControlName="designation"
              placeholder="Designation"
            />
          </label>

          <label class="contacts__field">
            <span class="contacts__label">Address</span>
            <select class="contacts__control contacts__control--soft" formControlName="address">
              @for (a of addressOptions; track a) {
                <option [value]="a">{{ a === '' ? 'Address' : a }}</option>
              }
            </select>
          </label>

          <footer class="contacts__modal-foot">
            <button type="submit" class="contacts__btn-create">
              {{ editingNumericId() != null ? 'Save' : 'Create' }}
            </button>
          </footer>
        </form>
      </div>
    </div>
  }

  <div class="contacts__table-card card">
    <div class="contacts__table-scroll">
      <table class="contacts__table">
        <thead>
          <tr class="contacts__thead-row">
            <th class="contacts__th contacts__th--check">
              <input
                type="checkbox"
                class="contacts__checkbox"
                [checked]="allSelected()"
                (change)="toggleSelectAll()"
                aria-label="Select all contacts"
              />
            </th>
            <th class="contacts__th">Email</th>
            <th class="contacts__th">Phone</th>
            <th class="contacts__th">Organization</th>
            <th class="contacts__th">Last Modified</th>
            <th class="contacts__th">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (row of rows(); track row.id) {
            <tr class="contacts__row">
              <td class="contacts__td contacts__td--check">
                <input
                  type="checkbox"
                  class="contacts__checkbox"
                  [checked]="isRowSelected(row.id)"
                  (change)="toggleRow(row.id, $event)"
                  [attr.aria-label]="'Select ' + row.email"
                />
              </td>
              <td class="contacts__td contacts__td--strong">{{ row.email }}</td>
              <td class="contacts__td">{{ row.phone }}</td>
              <td class="contacts__td">{{ row.organization }}</td>
              <td class="contacts__td contacts__td--muted">{{ row.lastModified }}</td>
              <td class="contacts__td">
                <button type="button" class="contacts__linkish" (click)="deleteContact(row, $event)">Delete</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
