<div class="login">
  <div class="login__card">
    <div class="login__brand">
      @if (branding.logoUrl(); as logoSrc) {
        <img class="login__logo-img" [src]="logoSrc" [alt]="branding.brandLabel()" />
      } @else {
        <span class="login__logo">{{ branding.brandLabel() }}</span>
      }
      @if (branding.taglineLabel(); as tagline) {
        <span class="login__tagline">{{ tagline }}</span>
      }
    </div>
    <h1 class="login__title">Sign in</h1>
    <p class="login__sub">Use your work email and password to continue.</p>

    <form class="login__form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="login__field">
        <span class="login__label">Email</span>
        <input
          class="login__control"
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="you@company.com"
        />
        @if (form.get('email')?.invalid && (form.get('email')?.dirty || form.get('email')?.touched)) {
          <span class="login__err">Enter a valid email.</span>
        }
      </label>

      <label class="login__field">
        <span class="login__label">Password</span>
        <div class="login__password-wrap">
          <input
            class="login__control"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
          <button
            type="button"
            class="login__password-toggle"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword()"
            (click)="togglePasswordVisibility()"
          >
            @if (showPassword()) {
            <svg class="login__password-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            } @else {
            <svg class="login__password-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            }
          </button>
        </div>
        @if (form.get('password')?.invalid && (form.get('password')?.dirty || form.get('password')?.touched)) {
          <span class="login__err">At least 6 characters.</span>
        }
      </label>

      @if (formError(); as err) {
        <p class="login__banner" role="alert">{{ err }}</p>
      }

      <button type="submit" class="login__submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
