@if (toast.visible() && toast.message(); as msg) {
  <div
    class="toast"
    [class.toast--success]="toast.type() === 'success'"
    [class.toast--error]="toast.type() === 'error'"
    [class.toast--info]="toast.type() === 'info'"
    role="status"
    [attr.aria-live]="toast.type() === 'error' ? 'assertive' : 'polite'"
  >
    {{ msg }}
  </div>
}
