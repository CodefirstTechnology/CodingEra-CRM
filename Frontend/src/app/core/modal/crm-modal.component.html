@if (open()) {
  <div class="crm-modal__root" role="presentation">
    <button
      type="button"
      class="crm-modal__backdrop"
      (click)="onBackdropClick()"
      aria-label="Close dialog"
    ></button>
    <div
      #panel
      class="{{ panelClass() }}"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="title() ? titleId : null"
      tabindex="-1"
      (click)="$event.stopPropagation()"
    >
      @if (title()) {
        <header class="crm-modal__head">
          <h2 [id]="titleId" class="crm-modal__title">{{ title() }}</h2>
          @if (showClose()) {
            <button type="button" class="crm-modal__icon" (click)="onCloseClick()" aria-label="Close">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6 6 18M6 6l12 12" />
              </svg>
            </button>
          }
        </header>
      }
      <div class="crm-modal__body">
        <ng-content />
      </div>
      @if (showFooter()) {
        <footer class="crm-modal__foot">
          <ng-content select="[crmModalFooter]" />
        </footer>
      }
    </div>
  </div>
}
