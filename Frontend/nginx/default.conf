server {
    listen 80;
    server_name careerpath4u.com www.careerpath4u.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name careerpath4u.com www.careerpath4u.com;

    ssl_certificate /etc/letsencrypt/live/careerpath4u.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careerpath4u.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # CRM API — fixes POST /api/auth/login (405 error)
    location /api/ {
        proxy_pass http://codingera_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "keep-alive";
        proxy_cache_bypass $http_upgrade;
    }

    # IndiaMART Pull API — fixes Sync IndiaMART (CORS in browser)
    location /indiamart-mapi/ {
        proxy_pass https://mapi.indiamart.com/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host mapi.indiamart.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.careerpath4u.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.careerpath4u.com;

    ssl_certificate /etc/letsencrypt/live/careerpath4u.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careerpath4u.com/privkey.pem;

    location / {
        proxy_pass http://codingera_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "keep-alive";
        proxy_cache_bypass $http_upgrade;
    }
}