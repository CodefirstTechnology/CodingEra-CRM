server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Include MIME types
    include /etc/nginx/mime.types;

    # Dynamic DNS resolution for Docker container & external upstreams
    resolver 127.0.0.11 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Gzip Compression for Angular SPA assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. API Endpoints Proxy
    location /api/ {
        proxy_pass http://codingera_backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for Hubs mapped under /api/hubs/...)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. SignalR Hub Proxy (/hubs/user-status)
    location /hubs/ {
        proxy_pass http://codingera_backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Long timeouts for persistent SignalR connections (prevents 504 Gateway Timeout)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # 3. Canonical IndiaMART Reverse Proxy (/indiamart-mapi/...)
    location /indiamart-mapi/ {
        # Strips '/indiamart-mapi/' and forwards remaining path to https://mapi.indiamart.com/
        proxy_pass https://mapi.indiamart.com/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_set_header Host mapi.indiamart.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 4. Angular SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

